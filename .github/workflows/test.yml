name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      # check_public_package.py and safeio need POSIX openat support; on Windows they exit BLOCKED by design.
      - name: Public package check
        if: runner.os != 'Windows'
        run: python -B scripts/check_public_package.py .
      - name: Example reports validate
        run: python -B scripts/validate_report.py assets/examples/after-fix-report.json --baseline assets/examples/baseline-report.json --public
      # Read-only run against the runner itself; the report stays in RUNNER_TEMP and is never uploaded.
      - name: Host checks smoke run
        run: python -B scripts/host_checks.py --out "$RUNNER_TEMP/host-checks.json" --time-budget 120 --max-entries 200000
